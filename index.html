<style>
  html,body{margin:0;height:100%;background:#F4EFE7}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  .muat{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:system-ui,sans-serif;color:#5E6577;text-align:center;padding:16px}
  .muat img{width:64px;height:64px;border-radius:50%;background:#fff}
  .muat a{color:#9A6A12}
</style>
</head>
<body>
<!-- The portal runs inside this full-screen frame, so the Google Apps Script warning banner is not shown. -->
<div class="muat" id="muat"><img src="logo.png" alt=""><div>Loading Staff Portal…</div>
  <div style="font-size:13px">Taking too long? <a id="terus" href="#">Open the portal directly</a></div></div>
<iframe id="portal" title="Staff Portal · KMB Examination System" allow="clipboard-write"></iframe>
<script>
  // Apps Script /exec link of the Staff Portal. If a new deployment changes the link, change it here only.
  const PORTAL = 'https://script.google.com/a/macros/kmb-digital-unit.net/s/AKfycbz0Rj_cYsNGqbn5iaMsBKNYabW84C9wtJtJrQcbLbBHR4viAI5kSRtRJ4aFcdrWhV8V9w/exec';
  const f = document.getElementById('portal');
  document.getElementById('terus').href = PORTAL;
  f.onload = () => { document.getElementById('muat').hidden = true; };
  f.src = PORTAL;
</script>
</body>
